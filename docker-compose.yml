version: '3.8'

services:
  soloshine_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soloshine_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - STORAGE_DRIVER=local
      - SERVER_URL=${SERVER_URL:-http://localhost:3000}
      - DATA_BASE_URL=${DATA_BASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    volumes:
      # Crucial: Persistent storage for images and PDFs so redeploys don't lose files
      - soloshine_uploads:/app/uploads

volumes:
  soloshine_uploads:
    name: soloshine_uploads
